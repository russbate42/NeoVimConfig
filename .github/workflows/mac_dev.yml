name: Interactive MacOS Shell
on:
  workflow_dispatch:

jobs:
  interactive-ssh:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: mac_support

      - name: Open SSH Session
        uses: owenthereal/action-upterm@v2
        timeout-minutes: 120
        with:
          limit-access-to-actor: true
